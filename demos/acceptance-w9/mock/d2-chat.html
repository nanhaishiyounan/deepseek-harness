<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 晨检锐蓝 · 晨光仪表 — chat mock</title>
<style>
  /* D2 chat：方角气泡 / 表格式回执（线分层台账）/ 深蓝用户轨 */
  :root {
    --dshm-canvas: #f1f4f8; --dshm-card: #ffffff;
    --dshm-ink: #101c2e; --dshm-ink-sub: #4a5a70; --dshm-ink-weak: #8494a8;
    --dshm-brand: #1e4e8c; --dshm-brand-soft: #e8f0f9;
    --dshm-line: #d9e0e8; --dshm-line-soft: #e6ecf2;
    --dshm-success: #256f3a; --dshm-success-soft: #f5fae5;
    --dshm-info: #0070f2; --dshm-info-soft: #e1f4ff;
    --dshm-r-ctl: 8px;
    --font-num: 'SF Mono', ui-monospace, 'Menlo', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 375px; height: 812px; overflow: hidden; background: var(--dshm-canvas);
    color: var(--dshm-ink); font-variant-numeric: tabular-nums;
    font-family: -apple-system, 'BlinkMacSystemFont', 'PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', sans-serif;
    display: flex; flex-direction: column; }
  .statusbar { height: 44px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; font-size: 12px; font-weight: 600; }
  .nav { height: 52px; background: var(--dshm-card); border-bottom: 1px solid var(--dshm-line);
    display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .nav .back { font-size: 24px; width: 32px; color: var(--dshm-ink); }
  .nav .stamp { width: 32px; height: 32px; border-radius: var(--dshm-r-ctl); background: var(--dshm-brand);
    color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .nav .who .n { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .nav .who .n .ai { font-size: 9px; font-weight: 700; color: var(--dshm-brand); letter-spacing: 1px;
    background: var(--dshm-brand-soft); padding: 2px 6px; border-radius: 4px; }
  .nav .who .d { font-size: 11px; color: var(--dshm-ink-sub); }

  .flow { flex: 1; overflow: hidden; padding: 16px 16px 6px; display: flex; flex-direction: column; gap: 12px; }
  .day { text-align: center; font-size: 11px; color: var(--dshm-ink-weak); font-family: var(--font-num); }
  .row { display: flex; gap: 9px; }
  .row.me { justify-content: flex-end; }
  .row.me .bub { background: var(--dshm-brand); color: #fff; border-radius: 8px 8px 3px 8px; }
  .row.ai .ava { width: 32px; height: 32px; border-radius: var(--dshm-r-ctl); background: var(--dshm-brand);
    color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
  .bub { max-width: 268px; padding: 12px 15px; font-size: 15px; line-height: 1.6;
    background: var(--dshm-card); border: 1px solid var(--dshm-line);
    border-radius: 8px 8px 8px 3px; }

  .ask { max-width: 288px; background: var(--dshm-card); border: 1px solid var(--dshm-line);
    border-left: 3px solid var(--dshm-brand); border-radius: var(--dshm-r-ctl); padding: 14px 16px 13px; }
  .ask .tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--dshm-brand); }
  .ask .q { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .ask .h { font-size: 12px; color: var(--dshm-ink-sub); margin-top: 3px; font-family: var(--font-num); }
  .ask .opts { display: flex; gap: 8px; margin-top: 12px; }
  .ask .opt { height: 40px; padding: 0 15px; border-radius: var(--dshm-r-ctl); border: 1px solid var(--dshm-brand);
    color: var(--dshm-brand); background: var(--dshm-brand-soft); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; }
  .ask .opt.ghost { background: var(--dshm-card); }

  .receipt { max-width: 296px; background: var(--dshm-card); border: 1px solid var(--dshm-line);
    border-radius: var(--dshm-r-ctl); overflow: hidden; }
  .receipt .hd { display: flex; align-items: center; gap: 9px; padding: 13px 15px 11px;
    border-bottom: 1px solid var(--dshm-line-soft); }
  .receipt .hd .ok { width: 30px; height: 30px; border-radius: var(--dshm-r-ctl); background: var(--dshm-success);
    display: grid; place-items: center; }
  .receipt .hd .tt { font-size: 14px; font-weight: 800; }
  .receipt .hd .no { font-size: 11px; color: var(--dshm-ink-sub); font-family: var(--font-num); }
  .receipt .hd .st { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--dshm-info);
    background: var(--dshm-info-soft); padding: 4px 9px; border-radius: 4px; }
  .receipt .r { display: flex; justify-content: space-between; padding: 9px 15px; font-size: 13px; }
  .receipt .r + .r { border-top: 1px solid var(--dshm-line-soft); }
  .receipt .r .k { color: var(--dshm-ink-sub); }
  .receipt .r .v { font-weight: 600; }
  .receipt .r .v.num { font-family: var(--font-num); }
  .receipt .r.total .v { color: var(--dshm-brand); font-weight: 700; }

  .tail { font-size: 12px; color: var(--dshm-ink-sub); max-width: 268px; line-height: 1.7; }

  .composer { background: var(--dshm-card); border-top: 1px solid var(--dshm-line);
    padding: 10px 14px 30px; }
  .ctx-chips { display: flex; gap: 8px; margin-bottom: 9px; }
  .ctx { height: 30px; padding: 0 11px; border-radius: 6px; background: var(--dshm-canvas);
    border: 1px solid var(--dshm-line); font-size: 12px; font-weight: 600; color: var(--dshm-ink-sub);
    display: flex; align-items: center; gap: 6px; }
  .inbox { display: flex; align-items: center; gap: 10px; }
  .field { flex: 1; height: 46px; background: var(--dshm-canvas); border: 1px solid var(--dshm-line);
    border-radius: var(--dshm-r-ctl); padding: 0 16px; font-size: 16px; color: var(--dshm-ink-weak);
    display: flex; align-items: center; }
  .send { width: 46px; height: 46px; border-radius: var(--dshm-r-ctl); background: var(--dshm-brand);
    display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●●</span></div>
  <div class="nav">
    <div class="back">‹</div>
    <div class="stamp">表</div>
    <div class="who"><div class="n">填表助手<span class="ai">AI</span></div><div class="d">单据登记与任务执行</div></div>
  </div>

  <div class="flow">
    <div class="day">TODAY 09:32</div>

    <div class="row me"><div class="bub">向宏发食品采购 500kg 面粉，单价 3.2</div></div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="ask">
        <span class="tag">FIELD&nbsp;1/1</span>
        <div class="q">这批面粉入哪个仓库？</div>
        <div class="h">确认后按 PO-2026-1042 生成</div>
        <div class="opts">
          <div class="opt">东仓 A01</div>
          <div class="opt ghost">西仓 B02</div>
        </div>
      </div>
    </div>

    <div class="row me"><div class="bub">东仓 A01</div></div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="receipt">
        <div class="hd">
          <div class="ok"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg></div>
          <div><div class="tt">采购单已登记</div><div class="no">№ 1042 · PO-2026-1042</div></div>
          <div class="st">已提交</div>
        </div>
        <div class="r"><span class="k">供应商</span><span class="v">宏发食品</span></div>
        <div class="r"><span class="k">品名 / 数量</span><span class="v num">高筋面粉 · 500 kg</span></div>
        <div class="r"><span class="k">单价</span><span class="v num">¥ 3.20 / kg</span></div>
        <div class="r total"><span class="k">金额</span><span class="v num">¥ 1,600.00</span></div>
      </div>
    </div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="tail">单据已提交审批，可在「看单据」里跟踪进度。要顺手登记下一笔吗？</div>
    </div>
  </div>

  <div class="composer">
    <div class="ctx-chips">
      <div class="ctx">采购单 №1042 ×</div>
      <div class="ctx">换个说法 ×</div>
    </div>
    <div class="inbox">
      <div class="field">说一句，或点上面的问题…</div>
      <div class="send"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2.5-7.5z"/></svg></div>
    </div>
  </div>
</body>
</html>
