<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 晨检锐蓝 · 晨光仪表 — home mock</title>
<style>
  /* D2「晨光仪表」— 深墨蓝大色块 hero / 48px tabular 数字面板 / 细线分层 / 锐利 10px 几何
   * 与 W7 铸造同源蓝系（#1E4E8C / #16304F），mobile 子语言 = 提饱和提对比 + 仪表化数字。 */
  :root {
    --dshm-canvas: #f1f4f8; --dshm-card: #ffffff;
    --dshm-ink: #101c2e; --dshm-ink-sub: #4a5a70; --dshm-ink-weak: #8494a8;
    --dshm-brand: #1e4e8c; --dshm-hero: #16304f; --dshm-hero-2: #23406b;
    --dshm-accent: #0e7490; --dshm-brand-soft: #e8f0f9;
    --dshm-line: #d9e0e8; --dshm-line-soft: #e6ecf2;
    --dshm-success: #256f3a; --dshm-success-soft: #f5fae5;
    --dshm-warning: #e76500; --dshm-warning-soft: #fff8d6;
    --dshm-danger: #aa0808;  --dshm-danger-soft: #ffeaf4;
    --dshm-info: #0070f2;    --dshm-info-soft: #e1f4ff;
    --dshm-r-card: 10px; --dshm-r-ctl: 8px;
    --font-num: 'SF Mono', ui-monospace, 'Menlo', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 375px; height: 812px; overflow: hidden; background: var(--dshm-canvas);
    color: var(--dshm-ink); font-variant-numeric: tabular-nums; position: relative;
    font-family: -apple-system, 'BlinkMacSystemFont', 'PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', sans-serif; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    font-size: 12px; font-weight: 600; color: #fff; }

  /* ── Hero：深墨蓝大色块 + 晨检数字面板（签名） ─────── */
  .hero { background: linear-gradient(148deg, var(--dshm-hero) 0%, #1b3a63 74%, #1e4e8c 100%);
    padding: 58px 20px 24px; border-radius: 0 0 26px 26px; color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; right: -46px; top: -46px; width: 190px; height: 190px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.14); }
  .hero::before { content: ''; position: absolute; right: -10px; top: -80px; width: 190px; height: 190px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.10); }
  .hero .greet { font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #9db8d9; }
  .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; margin-top: 6px; }
  .hero .date { font-size: 12px; color: #9db8d9; margin-top: 6px; font-family: var(--font-num); }
  .panel { margin-top: 18px; background: rgba(13, 29, 52, 0.55); border: 1px solid rgba(157, 184, 217, 0.28);
    border-radius: 12px; padding: 14px 16px 12px; }
  .panel .cap { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #9db8d9; margin-bottom: 6px; }
  .panel .big { display: flex; align-items: baseline; gap: 8px; }
  .panel .big .n { font-family: var(--font-num); font-size: 44px; font-weight: 700; line-height: 1;
    letter-spacing: -2px; color: #fff; }
  .panel .big .u { font-size: 12px; color: #9db8d9; font-weight: 600; }
  .panel .sub { display: flex; gap: 18px; margin-top: 10px; }
  .panel .sub div { font-size: 11px; color: #9db8d9; }
  .panel .sub b { color: #fff; font-family: var(--font-num); font-size: 14px; margin-right: 3px; }
  .panel .sub .up { color: #ffb682; }

  .page { padding: 16px 20px 96px; display: flex; flex-direction: column; gap: 18px; }

  .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px;
    background: var(--dshm-card); border: 1px solid var(--dshm-line); border-radius: var(--dshm-r-ctl); }
  .search span { font-size: 14px; color: var(--dshm-ink-weak); }

  /* ── 台账：细线分层行式（无卡片堆叠） ─────────────── */
  .ledger { background: var(--dshm-card); border: 1px solid var(--dshm-line); border-radius: var(--dshm-r-card); }
  .ledger .cap { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--dshm-line-soft); }
  .ledger .cap h2 { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
  .ledger .cap a { font-size: 12px; color: var(--dshm-brand); font-weight: 600; text-decoration: none; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; }
  .lrow + .lrow { border-top: 1px solid var(--dshm-line-soft); }
  .lrow .bar { width: 3px; height: 26px; border-radius: 2px; flex: none; }
  .lrow .name { font-size: 14px; font-weight: 600; color: var(--dshm-ink-sub); flex: 1; }
  .lrow .num { font-family: var(--font-num); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .lrow .note { font-size: 11px; color: var(--dshm-ink-weak); width: 76px; text-align: right; line-height: 1.4; }
  .lrow.todo .bar { background: var(--dshm-brand); } .lrow.todo .num { color: var(--dshm-brand); }
  .lrow.doing .bar { background: var(--dshm-info); } .lrow.doing .num { color: var(--dshm-info); }
  .lrow.review .bar { background: var(--dshm-warning); } .lrow.review .num { color: var(--dshm-warning); }
  .lrow.done .bar { background: var(--dshm-success); } .lrow.done .num { color: var(--dshm-success); }

  /* ── chips：方角几何 ───────────────────────────────── */
  .chips { display: flex; gap: 9px; }
  .chip-cta { height: 44px; padding: 0 18px; border-radius: var(--dshm-r-ctl); background: var(--dshm-brand);
    color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .chip-plain { height: 44px; padding: 0 14px; border-radius: var(--dshm-r-ctl);
    background: var(--dshm-card); border: 1px solid var(--dshm-line); font-size: 13px; font-weight: 600;
    color: var(--dshm-ink-sub); display: flex; align-items: center; }

  /* ── AI 同事：方形徽标 ────────────────────────────── */
  .rail-head { display: flex; justify-content: space-between; align-items: baseline; }
  .rail-head h2 { font-size: 17px; font-weight: 800; letter-spacing: 0.3px; }
  .rail-head a { font-size: 12px; color: var(--dshm-brand); text-decoration: none; font-weight: 600; }
  .rail { display: flex; gap: 14px; margin-top: 12px; }
  .colleague { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 62px; }
  .colleague .ava { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: #fff; position: relative; }
  .colleague .dot { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px;
    border-radius: 50%; background: #35c759; border: 2.5px solid var(--dshm-canvas); }
  .colleague .nm { font-size: 12px; font-weight: 600; }

  /* ── 最近会话 ─────────────────────────────────────── */
  .recent { background: var(--dshm-card); border: 1px solid var(--dshm-line); border-radius: var(--dshm-r-card); }
  .conv { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .conv + .conv { border-top: 1px solid var(--dshm-line-soft); }
  .conv .stamp { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; flex: none; }
  .conv .mid { flex: 1; min-width: 0; }
  .conv .t { font-size: 14px; font-weight: 700; display: flex; gap: 7px; align-items: center; }
  .conv .t .unread { width: 7px; height: 7px; border-radius: 50%; background: var(--dshm-brand); }
  .conv .p { font-size: 12px; color: var(--dshm-ink-sub); margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .conv .tm { font-size: 11px; color: var(--dshm-ink-weak); font-family: var(--font-num); }

  /* ── TabBar：细指示条 + 线性图标 ──────────────────── */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #ffffff;
    border-top: 1px solid var(--dshm-line); display: flex; padding: 6px 8px 24px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; color: var(--dshm-ink-sub); font-weight: 600; }
  .tab .ind { width: 20px; height: 3px; border-radius: 0 0 3px 3px; background: transparent; }
  .tab.on { color: var(--dshm-brand); }
  .tab.on .ind { background: var(--dshm-brand); }
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●●</span></div>

  <div class="hero">
    <div class="greet">MORNING&nbsp;CHECK</div>
    <h1>早上好，高翔</h1>
    <div class="date">10-05 MON · 霜降 · 灌装一班</div>
    <div class="panel">
      <div class="cap">今日晨检面板</div>
      <div class="big"><span class="n">98.2</span><span class="u">% 产线直通率</span></div>
      <div class="sub">
        <div><b>5</b>待处理</div>

  <div class="page">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8494a8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>

    <div class="chips">
      <div class="chip-cta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>登记一条单据</div>
      <div class="chip-plain">我的待办</div>

    <div>
      <div class="rail-head"><h2>AI 同事</h2><a>全部 ›</a></div>
      <div class="rail">
        <div class="colleague"><div class="ava" style="background:#1e4e8c;">表<span class="dot"></span></div><span class="nm">填表助手</span></div>
        <div class="colleague"><div class="ava" style="background:#1d5f5a;">参<span class="dot"></span></div><span class="nm">经营参谋</span></div>
        <div class="colleague"><div class="ava" style="background:#2e5e34;">数<span class="dot"></span></div><span class="nm">数据助手</span></div>
        <div class="colleague"><div class="ava" style="background:#7a5230;">合<span class="dot"></span></div><span class="nm">合规官</span></div>
      </div>
    </div>

    <div>
      <div class="rail-head"><h2>最近会话</h2></div>
      <div class="recent" style="margin-top: 12px;">
        <div class="conv">
          <div class="stamp" style="background:#1e4e8c;">表</div>
          <div class="mid"><div class="t">填表助手<span class="unread"></span></div><div class="p">已登记 №1042 · 采购单</div></div>
          <span class="tm">09:32</span>
        </div>
        <div class="conv">
          <div class="stamp" style="background:#1d5f5a;">参</div>
          <div class="mid"><div class="t">经营参谋</div><div class="p">本月采购额按供应商拆开看…</div></div>
          <span class="tm">昨天</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><div class="ind"></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>首页</div>
    <div class="tab"><div class="ind"></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.2c2.9.4 5.5 2.7 5.5 5.8"/></svg>同事</div>
    <div class="tab"><div class="ind"></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg>工作</div>
    <div class="tab"><div class="ind"></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5"/></svg>我的</div>
  </div>
</body>
</html>
