<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 墨纸编辑部 · 食谱书页 — chat mock</title>
<style>
  /* D3 chat：便签气泡 / 朱砂批注 / 宋体问句 / 台账纸表 */
  :root {
    --dshm-canvas: #f8f4ea; --dshm-card: #fffdf7; --dshm-card2: #f3eee0;
    --dshm-ink: #29241b; --dshm-ink-sub: #6e6454; --dshm-ink-weak: #a29880;
    --dshm-brand: #b3402a; --dshm-brand-soft: #f5e6dc;
    --dshm-anchor: #1e4e8c;
    --dshm-line: #e6dec9; --dshm-rule: #c9bfa4;
    --dshm-success: #4a6737; --dshm-success-soft: #edf2e2;
    --dshm-info: #3a6884; --dshm-info-soft: #e6eef2;
    --dshm-r-card: 8px; --dshm-r-ctl: 6px;
    --font-display: 'Songti SC', 'STSong', 'Noto Serif SC', 'SimSun', serif;
    --font-num: 'SF Mono', ui-monospace, 'Menlo', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 375px; height: 812px; overflow: hidden; background: var(--dshm-canvas);
    color: var(--dshm-ink); font-variant-numeric: tabular-nums;
    font-family: -apple-system, 'BlinkMacSystemFont', 'PingFang SC', 'HarmonyOS Sans SC', 'Noto Sans SC', sans-serif;
    display: flex; flex-direction: column; }
  .statusbar { height: 44px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; font-size: 12px; font-weight: 600; }
  .nav { height: 52px; background: var(--dshm-card); border-bottom: 1px solid var(--dshm-rule);
    display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .nav .back { font-size: 24px; width: 32px; }
  .nav .mark { font-family: var(--font-display); font-size: 19px; font-weight: 900; color: #1e4e8c;
    width: 34px; height: 34px; border: 2px solid #1e4e8c; border-radius: 50%; display: grid;
    place-items: center; }
  .nav .who .n { font-family: var(--font-display); font-size: 17px; font-weight: 900; letter-spacing: 1px;
    display: flex; align-items: center; gap: 7px; }
  .nav .who .n .ai { font-family: -apple-system, 'PingFang SC', sans-serif; font-size: 9px; font-weight: 700;
    color: var(--dshm-brand); border: 1px solid var(--dshm-brand); border-radius: 4px;
    padding: 1px 5px; letter-spacing: 1px; }
  .nav .who .d { font-size: 11px; color: var(--dshm-ink-sub); letter-spacing: 1px; }

  .flow { flex: 1; overflow: hidden; padding: 18px 18px 6px; display: flex; flex-direction: column; gap: 15px; }
  .day { text-align: center; font-size: 11px; color: var(--dshm-ink-weak); letter-spacing: 2px; }
  .day span { border-bottom: 1px solid var(--dshm-rule); padding: 0 12px 4px; }

  .row { display: flex; gap: 10px; }
  .row.me { justify-content: flex-end; }
  /* 用户气泡：浓墨底 */
  .row.me .bub { background: var(--dshm-ink); color: #f8f4ea; border-radius: 8px 8px 3px 8px; }
  .row.ai .ava { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #1e4e8c; color: #1e4e8c;
    background: var(--dshm-card); font-family: var(--font-display); font-size: 14px; font-weight: 900;
    display: grid; place-items: center; flex: none; margin-top: 2px; }
  /* AI 气泡：便签纸 */
  .bub { max-width: 268px; padding: 13px 16px; font-size: 15px; line-height: 1.7;
    background: var(--dshm-card); border: 1px solid var(--dshm-line);
    border-radius: 8px 8px 8px 3px; }

  .ask { max-width: 288px; background: var(--dshm-card); border: 1px solid var(--dshm-rule);
    border-radius: var(--dshm-r-card); padding: 16px 18px 15px; }
  .ask .tag { font-family: var(--font-display); font-size: 12px; font-weight: 900; color: var(--dshm-brand);
    letter-spacing: 3px; display: flex; align-items: center; gap: 8px; }
  .ask .tag::after { content: ''; flex: 1; border-top: 1px solid var(--dshm-line); }
  .ask .q { font-family: var(--font-display); font-size: 19px; font-weight: 900; margin-top: 10px;
    letter-spacing: 1px; line-height: 1.5; }
  .ask .h { font-size: 12px; color: var(--dshm-ink-sub); margin-top: 5px; letter-spacing: 0.5px; }
  .ask .opts { display: flex; gap: 9px; margin-top: 13px; }
  .ask .opt { height: 40px; padding: 0 16px; border-radius: var(--dshm-r-ctl);
    border: 1.5px solid #b7a87f; background: var(--dshm-card2); font-size: 14px; font-weight: 600;
    letter-spacing: 1px; display: flex; align-items: center; }

  /* 回执：台账纸表 + 朱砂「收」印 */
  .receipt { max-width: 298px; background: var(--dshm-card); border: 1px solid var(--dshm-rule);
    border-top: 3px solid var(--dshm-brand); border-radius: var(--dshm-r-card); padding: 14px 17px 13px;
    position: relative; }
  .receipt .hd { display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--dshm-rule); }
  .receipt .tt { font-family: var(--font-display); font-size: 17px; font-weight: 900; letter-spacing: 1px; }
  .receipt .no { font-size: 11px; color: var(--dshm-ink-sub); font-family: var(--font-num); margin-top: 2px; }
  .receipt .st { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--dshm-info);
    border: 1px solid var(--dshm-info); border-radius: var(--dshm-r-ctl); padding: 3px 8px; letter-spacing: 1px; }
  .receipt .stamp-mini { position: absolute; right: 15px; top: 42px; width: 34px; height: 34px;
    border: 2px solid var(--dshm-brand); border-radius: 5px; color: var(--dshm-brand); opacity: 0.85;
    font-family: var(--font-display); font-size: 14px; font-weight: 900; display: grid; place-items: center;
    transform: rotate(-5deg); background: rgba(255, 253, 247, 0.7); }
  .receipt .r { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px;
    letter-spacing: 0.5px; border-bottom: 1px dashed var(--dshm-line); }
  .receipt .r:last-child { border-bottom: none; }
  .receipt .r .k { color: var(--dshm-ink-sub); }
  .receipt .r .v { font-weight: 600; }
  .receipt .r .v.num { font-family: var(--font-num); }

  .tail { font-size: 12.5px; color: var(--dshm-ink-sub); max-width: 268px; line-height: 1.8; }

  .composer { background: var(--dshm-card); border-top: 1px solid var(--dshm-rule);
    padding: 10px 16px 30px; }
  .ctx-chips { display: flex; gap: 8px; margin-bottom: 9px; }
  .ctx { height: 30px; padding: 0 12px; border-radius: var(--dshm-r-ctl); background: var(--dshm-card2);
    border: 1px solid var(--dshm-line); font-size: 12px; font-weight: 600; color: var(--dshm-ink-sub);
    display: flex; align-items: center; gap: 6px; }
  .inbox { display: flex; align-items: center; gap: 10px; }
  .field { flex: 1; height: 46px; background: var(--dshm-canvas); border: 1.5px solid #b7a87f;
    border-radius: var(--dshm-r-ctl); padding: 0 16px; font-size: 16px; color: var(--dshm-ink-weak);
    display: flex; align-items: center; }
  .send { width: 46px; height: 46px; border-radius: var(--dshm-r-ctl); background: var(--dshm-brand);
    display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●●</span></div>
  <div class="nav">
    <div class="back">‹</div>
    <div class="mark">表</div>
    <div class="who"><div class="n">填表助手<span class="ai">AI</span></div><div class="d">单据登记与任务执行</div></div>
  </div>

  <div class="flow">
    <div class="day"><span>今日 · 09:32</span></div>

    <div class="row me"><div class="bub">向宏发食品采购 500kg 面粉，单价 3.2</div></div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="ask">
        <span class="tag">补 一 项</span>
        <div class="q">这批面粉入哪个仓库？</div>
        <div class="h">确认后按 PO-2026-1042 生成采购单</div>
        <div class="opts">
          <div class="opt">东仓 A01</div>
          <div class="opt">西仓 B02</div>
        </div>
      </div>
    </div>

    <div class="row me"><div class="bub">东仓 A01</div></div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="receipt">
        <div class="hd">
          <div><div class="tt">采购单已登记</div><div class="no">№ 1042 · PO-2026-1042</div></div>
          <div class="st">已提交</div>
        </div>
        <div class="stamp-mini">收讫</div>
        <div class="r"><span class="k">供应商</span><span class="v">宏发食品</span></div>
        <div class="r"><span class="k">品名</span><span class="v">高筋面粉</span></div>
        <div class="r"><span class="k">数量</span><span class="v num">500 kg</span></div>
        <div class="r"><span class="k">单价</span><span class="v num">¥ 3.20 / kg</span></div>
        <div class="r"><span class="k">金额</span><span class="v num">¥ 1,600.00</span></div>
      </div>
    </div>

    <div class="row ai">
      <div class="ava">表</div>
      <div class="tail">单据已提交审批，可在「看单据」里跟踪进度。要顺手登记下一笔吗？</div>
    </div>
  </div>

  <div class="composer">
    <div class="ctx-chips">
      <div class="ctx">采购单 №1042 ×</div>
      <div class="ctx">换个说法 ×</div>
    </div>
    <div class="inbox">
      <div class="field">说一句，或点上面的问题…</div>
      <div class="send"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2.5-7.5z"/></svg></div>
    </div>
  </div>
</body>
</html>
