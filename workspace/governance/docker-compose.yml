# W24-B6 Tier1 catalog+governance sidecars: Apache Gravitino 1.3.1 (metadata
# catalog hub + embedded Iceberg REST service) and SeaweedFS 4.48 (S3 object
# storage that backs the Iceberg warehouse).
#
# MinIO note: the community edition stopped distribution (dl.min.io answers
# 410 Gone and the Docker Hub repository is gone — every mirror 403s), so the
# S3 seat moves to SeaweedFS (Apache-2.0, single binary, mature S3 gateway).
# The S3 API keeps the planned :9000 port and the object browser keeps :9001
# (the filer console), so downstream configs keep the task-book port budget.
#
# CN mirror: images were pre-pulled through docker.m.daocloud.io and retagged
# to the canonical names below; pull the daocloud-prefixed names instead when
# rehydrating a fresh host.
#
# Ports (host side, overridable via .env):
#   ${GRAVITINO_PORT:-8090}  Gravitino server + web UI + Iceberg REST
#   ${S3_PORT:-9000}         SeaweedFS S3 API (v4 signatures per s3 config)
#   ${S3_CONSOLE_PORT:-9001} SeaweedFS filer console (bucket/object browser)
services:
  gravitino:
    image: apache/gravitino:1.3.1
    container_name: dsh-gravitino
    ports:
      - "${GRAVITINO_PORT:-8090}:8090"
      # Embedded Iceberg REST service (aux): bridged onto the metalake's
      # iceberg catalog via the dynamic config provider, so what DuckDB
      # reaches through :8181 IS the metalake's `lakehouse` catalog.
      - "${GRAVITINO_REST_PORT:-8181}:9001"
    environment:
      GRAVITINO_UI_ENABLE: "true"
      # The entrypoint below installs the mounted config itself, so the
      # env-var rewrite (which only maps a fixed key set) is skipped.
      SKIP_CONFIG_REWRITE: "true"
    # Why an ENTRYPOINT override instead of a bind on the target path:
    # replacing an existing file via a single-file bind makes the JVM read
    # garbage on this colima/virtiofs host (silent exit 255), and the stock
    # entrypoint ignores a composed `command`. Copying from a fresh mount
    # path into place boots cleanly.
    entrypoint:
      - bash
      - -c
      - cp /custom/gravitino.conf /opt/gravitino/conf/gravitino.conf && exec /bin/bash /opt/gravitino/docker/docker-entrypoint.sh
    volumes:
      - gravitino-data:/root/gravitino/data
      # Stock image config plus the dynamic-provider bridge block (see the
      # tail of the file): gravitino-uri -> main server (all three of
      # uri/provider/metalake must be present or the aux service fails fast),
      # default metalake/catalog so plain REST clients need no
      # gravitino-metalake/catalog headers.
      - ./gravitino.conf:/custom/gravitino.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - governance

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: dsh-seaweedfs
    # One-process demo topology: master+volume+filer+S3 gateway in a single
    # `weed server`; volumes live under /data, buckets under the filer's
    # /buckets directory (created by the first S3 client).
    command: >
      server -dir=/data -ip=dsh-seaweedfs
      -master.volumeSizeLimitMB=2048
      -volume.max=0
      -filer -volume.port=8081
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3/s3.json
    ports:
      - "${S3_PORT:-9000}:8333"
      - "${S3_CONSOLE_PORT:-9001}:8888"
    volumes:
      - seaweed-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/status >/dev/null 2>&1 || curl -sf http://localhost:9333/cluster/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - governance

volumes:
  gravitino-data:
  seaweed-data:

networks:
  governance:
    name: dsh-governance
