<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM 工作台 · 商机管道 / 客户 360 / 报价转单</title>
<style>
  /* W7 铸造常量表（iframe 文档不继承 NocoBase 的 globalStyle，这里内嵌同值令牌——plans/plan-w7 §3.7 层3c） */
  :root {
    --w7-primary: #1E4E8C; --w7-primary-hover: #2A5FA6; --w7-primary-soft: #E8F0F9;
    --w7-positive-fg: #256F3A; --w7-positive-bg: #F5FAE5;
    --w7-critical-fg: #E76500; --w7-critical-bg: #FFF8D6;
    --w7-negative-fg: #AA0808; --w7-negative-bg: #FFEAF4;
    --w7-neutral-fg: #788FA6; --w7-neutral-bg: #EFF1F2;
    --w7-informational-fg: #0070F2; --w7-informational-bg: #E1F4FF;
    --w7-canvas: #F6F6F4; --w7-surface: #FFFFFF; --w7-surface-2: #FAFAF9;
    --w7-border: #E8E8E6; --w7-border-strong: #D8D8D5;
    --w7-text: #1F2630; --w7-text-secondary: #55606E; --w7-text-weak: #8A94A0;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--w7-canvas); color: var(--w7-text); font-size: 15px; }
  header { background: #fff; border-bottom: 1px solid var(--w7-border); padding: 12px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .who { margin-left: auto; font-size: 13px; color: var(--w7-text-secondary); }
  header button { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--w7-border-strong); background: var(--w7-surface-2); font-size: 14px; min-height: 40px; }
  main { padding: 16px; max-width: 1280px; margin: 0 auto; }
  .view { display: none; }
  .view.on { display: block; }
  .hint { color: var(--w7-text-weak); font-size: 13px; }
  .error { background: var(--w7-negative-bg); border: 1px solid var(--w7-negative-fg); color: var(--w7-negative-fg); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: none; white-space: pre-wrap; }
  .ok { background: var(--w7-positive-bg); border: 1px solid var(--w7-positive-fg); color: var(--w7-positive-fg); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: none; white-space: pre-wrap; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { min-height: 46px; padding: 8px 20px; border-radius: 12px; border: 1px solid var(--w7-border-strong); background: #fff; font-size: 15px; }
  .tabs button.active { border-color: var(--w7-primary); background: var(--w7-primary-soft); font-weight: 600; }
  /* stat cards */
  .statrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 168px; background: #fff; border: 1px solid var(--w7-border); border-radius: 14px; padding: 12px 16px; }
  .stat b { display: block; font-size: 22px; margin-top: 2px; }
  .stat span { font-size: 12px; color: var(--w7-text-secondary); }
  .stat.hl b { color: var(--w7-positive-fg); }
  /* kanban board */
  .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 10px; }
  .col { flex: 1 1 220px; min-width: 220px; background: var(--w7-surface-2); border: 1px solid var(--w7-border); border-radius: 14px; padding: 10px; }
  .col.over { outline: 2px dashed var(--w7-primary); outline-offset: -4px; background: var(--w7-primary-soft); }
  .col h3 { margin: 2px 4px 8px; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .col h3 .n { font-size: 18px; }
  .col .sum { margin: 0 4px 10px; font-size: 12px; color: var(--w7-text-secondary); background: #fff; border-radius: 8px; padding: 4px 8px; }
  .kcard { background: #fff; border: 1px solid var(--w7-border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(23,33,43,.04); }
  .kcard:active { cursor: grabbing; }
  .kcard.dragging { opacity: .45; }
  .kcard .name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .kcard .cust { color: var(--w7-text-secondary); font-size: 13px; }
  .kcard .amount { font-size: 16px; font-weight: 700; color: var(--w7-informational-fg); margin-top: 4px; }
  .kcard .meta { color: var(--w7-text-weak); font-size: 12px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .kcard .dwell { background: var(--w7-critical-bg); color: var(--w7-critical-fg); border-radius: 8px; padding: 1px 7px; font-size: 12px; }
  .kcard .dwell.old { background: var(--w7-negative-bg); color: var(--w7-negative-fg); }
  /* 360 */
  .pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--w7-border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; color: #46566c; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .kv b { color: #46566c; font-weight: 600; font-size: 13px; }
  .chip { display: inline-block; border-radius: 8px; padding: 2px 9px; font-size: 12px; background: var(--w7-surface-2); color: var(--w7-text-secondary); margin-right: 6px; }
  .chip.green { background: var(--w7-positive-bg); color: var(--w7-positive-fg); } .chip.orange { background: var(--w7-critical-bg); color: var(--w7-critical-fg); }
  .chip.red { background: var(--w7-negative-bg); color: var(--w7-negative-fg); } .chip.blue { background: var(--w7-primary-soft); color: var(--w7-informational-fg); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--w7-border); font-size: 13.5px; flex-wrap: wrap; }
  .row:last-child { border-bottom: none; }
  .row .r { color: var(--w7-text-secondary); text-align: right; }
  /* timeline */
  .tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--w7-border); }
  .tl li { position: relative; padding: 6px 0 10px 14px; }
  .tl li::before { content: ''; position: absolute; left: -24px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--w7-primary); border: 2px solid #fff; }
  .tl li.k-quote::before { background: var(--w7-informational-fg); } .tl li.k-order::before { background: var(--w7-primary); }
  .tl li.k-ship::before { background: var(--w7-positive-fg); } .tl li.k-payment::before { background: var(--w7-critical-fg); }
  .tl .d { font-size: 12px; color: var(--w7-text-weak); }
  .tl .t { font-weight: 600; font-size: 13.5px; }
  .tl .x { font-size: 13px; color: var(--w7-text-secondary); }
  /* quotes */
  .qcard { background: #fff; border: 1px solid var(--w7-border); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .qcard .no { font-weight: 700; }
  .qcard .meta { color: var(--w7-text-secondary); font-size: 13px; flex: 1 1 260px; }
  button.primary, .kcard button, .qcard button.go, .dcard button.go { min-height: 40px; padding: 8px 18px; border-radius: 10px; border: none; background: var(--w7-primary); color: #fff; font-size: 14px; }
  button.ghost { min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--w7-border-strong); background: #fff; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .dialog { position: fixed; inset: 0; background: rgba(23,33,43,.42); display: flex; align-items: center; justify-content: center; z-index: 9; }
  .dialog .box { background: #fff; border-radius: 16px; padding: 20px; width: min(680px, 94vw); max-height: 88vh; overflow: auto; }
  .lrow { display: flex; gap: 8px; margin: 6px 0; flex-wrap: wrap; align-items: center; }
  input, select { min-height: 40px; border-radius: 10px; border: 1px solid var(--w7-border-strong); padding: 8px 12px; font-size: 14px; background: #fff; }
  .login { max-width: 420px; margin: 48px auto; }
  .login .card { display: grid; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>CRM 工作台</h1>
  <nav class="tabs" id="nav">
    <button type="button" data-view="pipe-view" class="active">商机管道</button>
    <button type="button" data-view="cust-view">客户 360</button>
    <button type="button" data-view="quote-view">报价转单</button>
  </nav>
  <span class="who" id="who"></span>
  <button type="button" id="auth-btn">签到</button>
</header>
<main>
  <div class="error" id="error"></div>
  <div class="ok" id="ok"></div>

  <div class="view login" id="login-view">
    <div class="card">
      <h4>签到（平台账号——销售部可写，其他角色只读）</h4>
      <input id="login-account" placeholder="账号（如 sales_rep）" />
      <input id="login-password" type="password" placeholder="密码" />
      <button class="primary" type="button" id="login-btn">签到</button>
    </div>
  </div>

  <div class="view" id="pipe-view">
    <div class="statrow" id="pipe-stats"></div>
    <div class="board" id="board"></div>
    <div class="hint" style="margin-top:8px">拖动卡片到目标列完成阶段迁移（写回 crm_deals.stage+probability+status，并落 crm_stage_audit 审计行；加权值 = 金额 × 阶段概率）。</div>
  </div>

  <div class="view" id="cust-view">
    <div class="pick">
      <select id="cust-picker" style="min-width:320px"></select>
      <button class="ghost" type="button" id="cust-load">查看 360</button>
    </div>
    <div id="cust-detail"></div>
  </div>

  <div class="view" id="quote-view">
    <div id="quote-list"></div>
  </div>
</main>

<div id="dlg-mount"></div>
<script src="/crm/dist/crm.js"></script>
</body>
</html>
