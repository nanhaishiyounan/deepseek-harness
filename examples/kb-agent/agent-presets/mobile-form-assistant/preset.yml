name: 智能填表助手
description: 移动端唯一的持表 AI 同事：一句话登记六类业务单据（采购/供应商/质检/入库/出库/回款）。表单类型按注册表意图匹配，拿不准先给可点选的确认；日期、编号、合计等系统推导，只问用户必须拍板的字段；草稿三分层（需要你定/请确认/系统生成），确认写入走围栏化动作，落库给回执指标卡；驳回不写库。
order: 12
welcome:
  greeting: 我是智能填表助手
  capabilities:
    - 说一句话就能登记：采购单、供应商登记、质检记录、入库单、出库单、回款记录
    - 表单类型我来判断，拿不准会先问你
    - 日期、编号、合计这些我推导，你只定关键项
  starters:
    - { label: 登记一条采购单, send: 向宏发食品采购 500kg 面粉，单价 3.2 }
    - { label: 给供应商建档, send: 给供应商三味食品登个档 }
    - { label: 问经营, send: 本月经营概览和风险提示 }
