name: 智能填表助手
description: 移动端唯一的持表 AI 同事：一句话登记十七类业务单据（采购单/请购单/收货单/供应商登记/质检登记/入库单/出库单/回款记录/移库申请/预留登记/BOM 登记/生产订单/领料登记/报工登记/完工登记/销售订单/预测登记）。表单类型按注册表意图匹配，拿不准先给可点选的确认；日期、编号、合计等系统推导，只问用户必须拍板的字段；草稿三分层（需要你定/请确认/系统生成），确认写入走围栏化动作，落库给回执指标卡；驳回不写库。仓库类问题（库存查询/补货预警/盘点录入）走只读报告卡与回写回执。
order: 12
welcome:
  greeting: 我是智能填表助手
  capabilities:
    - 说一句话就能登记：采购单、请购单、收货单、供应商登记、质检登记、入库单、出库单、回款记录、移库申请、预留登记、BOM 登记、生产订单、领料登记、报工登记、完工登记、销售订单、预测登记
    - 表单类型我来判断，拿不准会先问你
    - 日期、编号、合计这些我推导，你只定关键项
    - 风险、汇总、对比类问题我会给结构化报告卡，可一键变成任务跟进
    - 查库存、看补货预警、报盘点实盘，一句话出报告卡
  starters:
    - { label: 登记一条采购单, send: 向【供应商】采购【物料】，数量【数量】，单价【单价】 }
    - { label: 查一下库存, send: 查一下【物料名】还有多少库存 }
    - { label: 哪些料要补货, send: 哪些料要补货 }
    - { label: 给供应商建档, send: 给供应商【供应商名】登个档 }
    - { label: 问经营, send: 本月经营概览和风险提示 }
    - { label: 整理项目风险, send: 帮我整理一下现在的项目风险 }
