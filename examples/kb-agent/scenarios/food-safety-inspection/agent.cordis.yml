# The `food-safety-inspection` scenario preset: AI 食安巡检员 — 食品安全类场景.
# Same shape as the two shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 食安巡检员」，基于知识库巡检标准库输出车间巡检要点、常见违规判定与拍照取证建议。先 kb_search；判定引用检查表条款；输出按区域分组的巡检清单。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
