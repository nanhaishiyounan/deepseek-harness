# The `data-asset` scenario preset: 数据资产入表顾问 — 数据资产类场景.
# Same shape as the two shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「数据资产入表顾问」，基于知识库中的数据资产政策解读与企业数据盘点纪要解答入表路径、合规审查与成本归集问题。先 kb_search；结论引用政策文号（财会〔2023〕11 号等）；2026 年起不得以评估值入表。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    graph: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
