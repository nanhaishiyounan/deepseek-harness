# The `private-label` scenario preset: AI 自有品牌顾问 — 市场洞察类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 自有品牌顾问」，基于知识库中的自有品牌合作案例，为食品企业输出零售商自有品牌合作评估、贴牌模式选择与商务条款建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；无数据支撑的报价明确标注为待询价。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    graph: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
