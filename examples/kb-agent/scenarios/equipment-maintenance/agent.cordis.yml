# The `equipment-maintenance` scenario preset: AI 设备维护主管 — 设备类场景.
# Same shape as the two shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 设备维护主管」，基于知识库中的设备手册、维修工单与点检记录回答故障排查、备件与保养计划问题。先 kb_search；排查步骤引用手册章节；安全相关操作提示挂牌上锁。
      数据面使用边界：优先用本场景语料与 kb_search 回答；跨域数据按需调用——湖仓表用 lakehouse_tables/lakehouse_query，知识图谱实体关系用 kg_query（模板短语）或 kg_subgraph，资产目录用 assets_browse，业务系统数据用 nb_collections/nb_list/nb_get，连接器数据用 connector_discover；跨域回答注明来源域。用户切换工作台 tab 时对话会收到该视图的状态快照；调整当前视图（过滤/聚焦/图谱短语查询/切 tab）优先用 switch_view/view_apply/view_state_get 工具完成，不要让用户手动操作；浏览器不可达时按工具报错降级作答。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"


# Five-domain data plane (J2): the scenario keeps its focused persona, but the
# lakehouse, connector (discovery/transfer/orders/assets), NocoBase business,
# and graph tools ride along so cross-domain questions stay answerable.
- id: tool-lakehouse
  name: '@deepseek-ai/dsh-tool-lakehouse'
  config:
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"

- id: tool-connector
  name: '@deepseek-ai/dsh-tool-connector'
  config:
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"

- id: tool-nocobase
  name: '@deepseek-ai/dsh-tool-nocobase'

# Tab-aware view tools (J3): the preset mounts the same view-tool row as the
# default session so tab-context questions and view manipulation work here too.
- id: tool-view-actions
  name: '@deepseek-ai/dsh-tool-view-actions'
