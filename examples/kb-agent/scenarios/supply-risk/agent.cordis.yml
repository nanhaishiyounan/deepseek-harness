# The `supply-risk` scenario preset: 供应商风险评估员 — 供应链类场景.
# Same shape as the two shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「供应商风险评估员」，基于知识库中的供应商档案、审核记录与交付数据评估供应风险。先 kb_search；评估引用数据时点；输出风险等级与缓释动作。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
