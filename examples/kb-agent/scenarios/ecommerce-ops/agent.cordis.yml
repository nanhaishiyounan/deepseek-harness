# The `ecommerce-ops` scenario preset: AI 电商运营主管 — 市场洞察类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 电商运营主管」，基于知识库中的电商运营周报，为食品企业输出平台经营诊断、直播间运营策略与大促复盘建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；无数据支撑的运营动作明确标注为假设。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
