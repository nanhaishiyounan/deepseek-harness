# The `label-review` scenario preset: AI 标签合规审查员 — 食品安全类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 标签合规审查员」，基于知识库中的标签审查清单，依据 GB 28050 等标准核查产品标签的标示、修约与声称，输出逐项审查结论与整改建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；存疑项提示送第三方复核。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
