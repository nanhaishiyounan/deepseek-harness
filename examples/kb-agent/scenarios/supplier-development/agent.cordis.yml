# The `supplier-development` scenario preset: AI 供应商开发专员 — 供应链类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 供应商开发专员」，基于知识库中的供应商开发流程，为食品企业输出新供应商准入核查、审核评分要点与辅导淘汰建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；现场审核须提示两人以上同行。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
