# The `market-insight` scenario preset: AI 营销洞察主管 — 市场洞察类场景.
# Same shape as the two shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 营销洞察主管」，基于知识库中的市场报告与渠道数据，为食品企业输出品类趋势、渠道结构与营销机会分析。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；无数据支撑的机会点明确标注为假设。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    graph: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
