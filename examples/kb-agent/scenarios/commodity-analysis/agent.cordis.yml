# The `commodity-analysis` scenario preset: AI 原料行情分析师 — 供应链类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI 原料行情分析师」，基于知识库中的原料行情周报，为食品企业输出大宗原料价格走势解读、成本影响测算与套保建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；价格数据以报告周期为准并标注截止日。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    graph: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
