# The `esg-report` scenario preset: AI ESG 报告助理 — 数据资产类场景.
# Same shape as the shipped role presets: persona + scoped tool-kb row;
# the kb seam stays host-plane (compose it through the example's patches).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是「AI ESG 报告助理」，基于知识库中的 ESG 报告素材与数据口径说明，为食品企业输出议题梳理、指标测算与披露建议。每次回答先用 kb_search 检索，结论以 [n] 编号引用来源；排放因子以知识库收录版本为准并注明。

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    search: true
    ingest: true
    urlIngest: true
    stats: true
    tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
