# Test-only composition for the kg-tools keyless snapshot: the
# knowledge-graph stack (seam, sqlite v2 store, tool-kb's kg_* rows). Seed
# rows are written directly through the graph seam by the spec, so the
# snapshot locks the model-facing kg tool surface without any extraction
# pipeline. Paths pin through the environment.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js "process.env.KG_TEST_ROOT ?? '.'"

- id: kb
  name: '@deepseek-ai/dsh-kb'
  config:
    storeProvider: kb-sqlite
    embedProvider: kb-embed-minimax

- id: kb-sqlite
  name: '@deepseek-ai/dsh-kb-sqlite'
  config:
    path: !!js "process.env.KG_TEST_ROOT + '/kb.sqlite'"

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    tenant: demo-food-co

- id: kb-graph
  name: '@deepseek-ai/dsh-kb-graph'

- id: kb-graph-sqlite
  name: '@deepseek-ai/dsh-kb-graph-sqlite'
  config:
    path: !!js "process.env.KG_TEST_ROOT + '/kg-graph.sqlite'"
