# Test-only composition for the expert-order keyless snapshot: the kb seam
# with its sqlite store (text-only degraded mode; the embed credential
# reference is pinned through the environment to a name nothing sets) and the
# orders seam pinned to the in-spec mock NocoBase, with the draft credential
# reference likewise pinned to a name nothing sets — so one scenario
# conversation discovers the expert card, places the order, generates the
# proposal PDF through the named template fallback, and reports the delivered
# order in the same transcript. Hermetic by construction.

- id: kb
  name: '@deepseek-ai/dsh-kb'

- id: kb-sqlite
  name: '@deepseek-ai/dsh-kb-sqlite'
  config:
    path: !!js "process.env.KB_TEST_DB ?? 'workspace/kb.sqlite'"

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js "process.env.KB_TEST_ROOT ?? process.cwd()"

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    tenant: demo-food-co

- id: connector
  name: '@deepseek-ai/dsh-connector'

- id: connector-nocobase
  name: '@deepseek-ai/dsh-connector-nocobase'
  config:
    baseUrl: !!js "process.env.EO_TEST_NC_URL ?? ''"
    apiKeyEnv: EO_TEST_NC_TOKEN

- id: tool-connector
  name: '@deepseek-ai/dsh-tool-connector'
  config:
    tenant: demo-food-co

- id: expert-orders
  name: '@deepseek-ai/dsh-expert-orders'
  config:
    baseUrl: !!js "process.env.EO_TEST_NC_URL ?? ''"
    apiKeyEnv: EO_TEST_NC_TOKEN
    draftApiKeyEnv: EO_TEST_DRAFT_ABSENT
    tenant: demo-food-co
    deliverablesDir: !!js "process.env.EO_TEST_DELIVERABLES ?? 'workspace/deliverables'"
