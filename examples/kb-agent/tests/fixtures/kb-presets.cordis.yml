# Test-only composition for the role-preset snapshot: the kb stack and the
# preset roster over the agent registries, with the SQLite path, fs root, and
# preset root pinned to test-provided locations through the environment, so
# runs never touch the example's own workspace.

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-minimax
  name: '@deepseek-ai/dsh-llm-minimax'

- id: kb
  name: '@deepseek-ai/dsh-kb'

- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: kb-sqlite
  name: '@deepseek-ai/dsh-kb-sqlite'
  config:
    path: !!js "process.env.KB_TEST_DB ?? 'workspace/kb.sqlite'"

- id: kb-embed-minimax
  name: '@deepseek-ai/dsh-kb-embed-minimax'
  config:
    apiKeyEnv: !!js "process.env.KB_TEST_EMBED_ENV ?? 'MINIMAX_API_KEY'"

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js "process.env.KB_TEST_ROOT ?? process.cwd()"

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: lakehouse
  name: '@deepseek-ai/dsh-lakehouse'
  config:
    dataRoot: !!js "process.env.LH_TEST_ROOT ?? 'workspace/lakehouse'"

- id: lakehouse-sqlite-catalog
  name: '@deepseek-ai/dsh-lakehouse-sqlite-catalog'
  config:
    path: !!js "process.env.LH_TEST_DB ?? ':memory:'"

- id: lakehouse-duckdb
  name: '@deepseek-ai/dsh-lakehouse-duckdb'

- id: connector
  name: '@deepseek-ai/dsh-connector'

# The view-tools services the preset tool row resolves outward to (the
# keyless bench has no gateway; tools fail loud with NO_PROVIDER at execute;
# injection stays off so the bench never emits view snapshots).
- id: view-actions
  name: '@deepseek-ai/dsh-view-actions'

- id: view-context
  name: '@deepseek-ai/dsh-view-context'
  config:
    enabled: false

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    tenant: demo-food-co

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: enterprise-data-assistant
    roots:
      - path: !!js "process.env.KB_TEST_PRESET_ROOT ?? 'agent-presets'"
        trust: system
    includeUserRoot: false
