# Test-only composition for the connector-flow keyless snapshot: the kb and
# lakehouse seams with their sqlite/duckdb providers, the connector seam with
# the file-set provider (root pinned through the environment) and the NocoBase
# provider (base url and token pinned to the in-spec mock server through the
# environment), and all three tool suites — everything path-pinned to
# test-provided locations so runs never touch the example's own workspace.

- id: kb
  name: '@deepseek-ai/dsh-kb'

- id: kb-sqlite
  name: '@deepseek-ai/dsh-kb-sqlite'
  config:
    path: !!js "process.env.KB_TEST_DB ?? 'workspace/kb.sqlite'"

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js "process.env.KB_TEST_ROOT ?? process.cwd()"

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    tenant: demo-food-co

- id: lakehouse
  name: '@deepseek-ai/dsh-lakehouse'
  config:
    dataRoot: !!js "process.env.LH_TEST_ROOT ?? 'workspace/lakehouse'"

- id: lakehouse-sqlite-catalog
  name: '@deepseek-ai/dsh-lakehouse-sqlite-catalog'
  config:
    path: !!js "process.env.LH_TEST_DB ?? ':memory:'"

- id: lakehouse-duckdb
  name: '@deepseek-ai/dsh-lakehouse-duckdb'

- id: tool-lakehouse
  name: '@deepseek-ai/dsh-tool-lakehouse'
  config:
    tenant: demo-food-co

- id: connector
  name: '@deepseek-ai/dsh-connector'

- id: connector-file
  name: '@deepseek-ai/dsh-connector-file'
  config:
    root: !!js "process.env.CF_TEST_FILES ?? 'workspace/data/connector-files'"

- id: connector-nocobase
  name: '@deepseek-ai/dsh-connector-nocobase'
  config:
    baseUrl: !!js "process.env.CF_TEST_NC_URL ?? ''"
    apiKeyEnv: CF_TEST_NC_TOKEN

- id: tool-connector
  name: '@deepseek-ai/dsh-tool-connector'
  config:
    tenant: demo-food-co
