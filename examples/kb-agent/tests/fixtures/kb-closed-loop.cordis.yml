# Test-only twin of ../../cordis.patch.yml: the knowledge-base loop without the
# agent spine, and with the SQLite path and fs root pinned to test-provided
# locations through the environment, so runs never touch the example's own
# workspace/kb.sqlite.

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-minimax
  name: '@deepseek-ai/dsh-llm-minimax'

- id: kb
  name: '@deepseek-ai/dsh-kb'

- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: kb-sqlite
  name: '@deepseek-ai/dsh-kb-sqlite'
  config:
    path: !!js "process.env.KB_TEST_DB ?? 'workspace/kb.sqlite'"

- id: kb-embed-minimax
  name: '@deepseek-ai/dsh-kb-embed-minimax'
  config:
    apiKeyEnv: !!js "process.env.KB_TEST_EMBED_ENV ?? 'MINIMAX_API_KEY'"

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js "process.env.KB_TEST_ROOT ?? process.cwd()"

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tool-kb
  name: '@deepseek-ai/dsh-tool-kb'
  config:
    tenant: demo-food-co
