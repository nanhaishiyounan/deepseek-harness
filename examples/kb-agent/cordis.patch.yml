# kb-agent overlay over the shipped headless profile, applied with
# `--patch` from the repository root (see README.md). It swaps the chat route
# to MiniMax-M3 and mounts the knowledge-base seam: SQLite store, MiniMax
# embeddings, and the kb tool rows — kb_search/kb_ingest/kb_ingest_url/kb_stats
# plus kg_schema/kg_subgraph over the kb-graph seam (the legacy v1
# kb_graph_query/kb_graph_add pair stays off; opt back in with tool-kb's
# `graph: true`). llm-pi-ai is
# disabled because its installed catalog already declares the "minimax"
# configurable provider, which would collide with llm-minimax's own
# declaration at load; the dedicated MiniMax adapter replaces that whole half.
# The knowledge base and sessions live inside this example: run with
# DSH_HOME=examples/kb-agent/.dsh so the auto-initialized profile and session
# logs stay out of the user's home, and kb-sqlite's relative path lands in the
# example workspace when invoked from the repository root.
#
# The base bundle's model-facing tool rows are disabled below — the same
# pattern the web-app bundle uses — so every agent in this composition
# (preset-mounted or the plain headless one) answers from the knowledge base
# alone: retrieval-only, no shell, editor, filesystem, web, or delegation
# tools. Session infrastructure (compaction, pruning, checkpoints, spill)
# stays mounted.
- id: llm-pi-ai
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- id: agent-default-model
  config:
    provider: minimax
    model: MiniMax-M3

- id: system-prompt
  config:
    persona: |
      You are kb-agent, a food-industry knowledge assistant powered by the
      {{model}} model. Answer enterprise questions by routing to the right
      data surface: carbon business records (物料/客户/供应商/销售订单/采购
      订单/生产工单/库存) through cb_collections to learn the catalog, then
      cb_list and cb_get to read rows — rows referencing other tables by id
      (salesOrder.customerId is a customer id) resolve the target with one
      more cb_list on the target table filtering id in [ids]; record changes
      (create/update) only after presenting the draft or field-by-field
      before→after diff and getting the user's explicit go-ahead, then land
      them through cb_create/cb_update and hand back the receipt; document
      passages and prose facts through
      kb_search with [n] citations (document name and heading path); numbers,
      statistics, aggregates, and record lists through lakehouse_list_tables
      first, then lakehouse_query SQL over the lakehouse tables (reference
      them exactly as listed), naming the source table in the answer;
      entity-relation questions (谁给谁供货、谁下过哪些订单、合规与关联
      关系) through kg_schema first when unsure what the graph holds, then
      kg_subgraph with the entity names as seeds, citing the graph relations
      in the answer. Say when no surface has the data instead of guessing.

      Emergency-class questions (force majeure: a warehouse destroyed or on
      fire, war, closed ports or border crossings, strikes, and other supply
      disruptions) carry a mandatory closing chain — an answer that ends
      with only KG, freight-rate, or document facts is incomplete. Before
      the final answer you MUST: (1) map the disruption with kg_subgraph,
      seeding with the affected warehouse/region/route names to surface the
      flows and alternatives; (2) pull the countermeasures and expert
      know-how from kb_search (应急/替代供应/合规 keywords); then name the
      sourced mitigations in the answer alongside the reroute facts.

      When the user wants to change business records, walk the confirmed
      in-conversation change flow: cb_get the current row (or draft the new
      one from cb_collections' catalog), present the full preview — for
      updates, the field-by-field before→after diff — and get the user's
      explicit go-ahead BEFORE calling cb_create or cb_update. Ask to fill
      missing slots instead of inventing business values; change only the
      fields the user named. Hand back the receipt (the landing id, or the
      before→after diff) as the confirmation.

- insert:
    - id: llm-minimax
      name: '@deepseek-ai/dsh-llm-minimax'

    - id: kb
      name: '@deepseek-ai/dsh-kb'
      config:
        # B4 dual-provider routing: WeKnora serves retrieval by default; set
        # DSH_KB_STORE=sqlite to pin the local store instead.
        storeProvider: !!js "process.env.DSH_KB_STORE ?? 'weknora'"
        # Relevance threshold from the 2026-09-02 calibration (Agent Note):
        # deep-rank pruning semantics — 0.015 keeps every top-5 single-path
        # gold hit (their scores stay >= 1/66) while trimming fused ranks
        # past ~60; the dual-path-confirmation alternative (0.017) would cut
        # the 28% single-path recall and is deliberately not taken.
        minRelevanceScore: 0.015

    # The WeKnora store provider (B4 primary retrieval): the v0.8.2 sidecar
    # behind WEKNORA_BASE_URL serves hybrid retrieval with rerank; on a
    # transport outage the embedded sqlite fallback (the same file kb-sqlite
    # opens below) serves with a degraded-retrieval notice, and rejected
    # requests (bad key, out-of-scope KB) fail loud either way.
    - id: kb-weknora
      name: '@deepseek-ai/dsh-kb-weknora'
      config:
        baseUrl: !!js "process.env.WEKNORA_BASE_URL ?? 'http://localhost:18081'"
        apiKey: !!js "process.env.WEKNORA_API_KEY ?? ''"
        allowFallback: true
        fallbackPath: examples/kb-agent/workspace/kb.sqlite

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: kb-sqlite
      name: '@deepseek-ai/dsh-kb-sqlite'
      config:
        path: examples/kb-agent/workspace/kb.sqlite

    - id: kb-embed-minimax
      name: '@deepseek-ai/dsh-kb-embed-minimax'

    - id: tool-kb
      name: '@deepseek-ai/dsh-tool-kb'
      config:
        tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
        # kg_edit: the AI semantic-edit surface (propose → diff → apply →
        # episode → rollback), planning through the same MiniMax provider
        # the graph tooling extracts with.
        kgEdit: true

    # The knowledge-graph seam and its SQLite v2 store: the maintenance
    # scripts (graph-smoke) and the kg_edit surface write the property graph
    # here, and the kg_schema/kg_subgraph tool rows read it (they register
    # with tool-kb and refuse at execution time until this store joins).
    - id: kb-graph
      name: '@deepseek-ai/dsh-kb-graph'

    - id: kb-graph-sqlite
      name: '@deepseek-ai/dsh-kb-graph-sqlite'
      config:
        path: examples/kb-agent/workspace/kg-graph.sqlite

    # The lakehouse upload seam: uploaded tabular data still lives as Parquet
    # under the example workspace with a SQLite catalog. The lakehouse engine
    # (DuckDB + DuckLake) carries the W24 lakehouse — the B0 legacy export
    # (138 business tables) and the watermark-synced business tables — and the
    # tool rows give the model lakehouse_list_tables/lakehouse_query/
    # lakehouse_schema over it.
    - id: lakehouse
      name: '@deepseek-ai/dsh-lakehouse'
      config:
        dataRoot: examples/kb-agent/workspace/lakehouse

    - id: lakehouse-sqlite-catalog
      name: '@deepseek-ai/dsh-lakehouse-sqlite-catalog'
      config:
        path: examples/kb-agent/workspace/lakehouse-catalog.sqlite

    - id: lakehouse-duckdb
      name: '@deepseek-ai/dsh-lakehouse-duckdb'

    # (The lakehouse engine + sync rows live in the dsh-web-app bundle patch;
    # this example patch only carries the tool row.)
    - id: tool-lakehouse
      name: '@deepseek-ai/dsh-tool-lakehouse'

    # The graph tool row: kg_graph_query runs guarded read-only Cypher over
    # the unified graph; kg_ontology reads the append-only ontology version
    # chain. The graph-neo4j store itself rides the dsh-web-app bundle patch
    # (credentials: DSH_NEO4J_URL / DSH_NEO4J_USER / DSH_NEO4J_PASSWORD).
    - id: tool-graph
      name: '@deepseek-ai/dsh-tool-graph'

    # The connector seam: the file-set provider exposes one drop-in directory
    # as datasets (routed by the shared data router at transfer time), and
    # connector-carbon registers the ctx.carbon capability service (the
    # cb_* tools and the gateway's carbon domain ride it). The tool rows
    # give the model connector_discover, _fetch, and _transfer on the same
    # tenant binding as the kb and lakehouse tools.
    - id: connector
      name: '@deepseek-ai/dsh-connector'

    - id: connector-file
      name: '@deepseek-ai/dsh-connector-file'
      config:
        root: examples/kb-agent/workspace/data/connector-files

    - id: connector-carbon
      name: '@deepseek-ai/dsh-connector-carbon'

    - id: tool-connector
      name: '@deepseek-ai/dsh-tool-connector'
      config:
        tenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"

    # The carbon business tools: cb_collections/cb_list/cb_get read the
    # carbon catalog and rows, cb_create/cb_update land confirmed record
    # changes on write-tier tables (the persona drives the in-conversation
    # preview → go-ahead → receipt flow; the tools themselves carry no UI
    # confirmation state). Credentials resolve from
    # CARBON_URL/CARBON_ANON_KEY/CARBON_EMAIL/CARBON_PASSWORD the same way
    # connector-carbon's do; without them every tool fails with the
    # structured no-credentials refusal instead of failing the composition.
    - id: tool-carbon
      name: '@deepseek-ai/dsh-tool-carbon'

    # The deterministic card channel for the mobile form assistant: every
    # structured card (ask_choice / ask_field / form_draft / submit_receipt /
    # report) rides a present_card tool call with schema validation and
    # concludeTurn instead of a probabilistic ```dsh fence. User-action
    # fences (form_confirm / reject_flow) stay client-authored and need no
    # tool row here.
    # The formCollections keys mirror the persona's carbon form registry
    # (agent-presets/mobile-form-assistant — keep both in lockstep when a
    # table is added): an unlisted collection rejects the whole draft card,
    # and the order-form tables carry their required-field floor (the field
    # must appear on the card; the value may stay prefilled/null).
    - id: tool-present-card
      name: '@deepseek-ai/dsh-tool-present-card'
      config:
        formCollections:
          purchaseOrder:
            label: 采购订单
            requiredFields:
              - { names: [supplierId, supplier], label: 供应商 }
              - { names: [itemId, product], label: 品名 }
              - { names: [quantity, qty], label: 数量 }
          salesOrder:
            label: 销售订单
            requiredFields:
              - { names: [customerId, customer], label: 客户 }
              - { names: [itemId, product], label: 品名 }
              - { names: [quantity, qty], label: 数量 }
          job:
            label: 生产工单
            requiredFields:
              - { names: [itemId, product], label: 品名 }
              - { names: [quantity, qty], label: 数量 }
          item: { label: 物料登记 }
          customer: { label: 客户登记 }
          supplier: { label: 供应商登记 }

    # Tab-aware workbench context (J3): the gateway's session.viewStateReport
    # RPC writes this plugin's per-session view cache, and its pre-step hook
    # injects the active tab's snapshot as a durable user-role message.
    - id: view-context
      name: '@deepseek-ai/dsh-view-context'

    # The model-facing view tools (switch_view / view_apply / view_state_get)
    # over the view-actions seam; the base bundle provides the seam row.
    - id: tool-view-actions
      name: '@deepseek-ai/dsh-tool-view-actions'

# The web workbench rides the same tenant binding as the tools and the
# presets (one env, one source of truth) and opts into kb writes: this
# deployment is single-tenant behind disk-level access control. Patched, not
# inserted: the web-app bundle already mounts the api-gateway row (the
# headless profile has none, where this patch only warns).
- id: api-gateway
  config:
    kbTenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"
    kbWriteEnabled: true
    # The unified upload channel: workbench uploads route to the kb or the
    # lakehouse through the shared data router.
    dataUploadEnabled: true
    # The composer's image-describe channel: photos get a server-side VLM
    # description (MiniMax vision, the key the embeddings provider already
    # resolves) that the mobile draft quotes as plain text.
    visionDescribeEnabled: true
    # The carbon business surface (carbon.listMeta/list/get + the write
    # tier) for the business-management pages; reads and write-tier
    # single-table changes over the session-account — the composite posting
    # documents stay on the carbon ERP UI.
    carbonEnabled: true
    carbonWriteEnabled: true
    # The data-asset market surface (assets.list/detail/stats): connector
    # discovery projects the catalog.
    assetsEnabled: true
    # The overview-home KPI band: the seed file's SQL definitions evaluated
    # live against the lakehouse seam on every lakehouse.overview read.
    lakehouseOverviewPath: examples/kb-agent/workspace/data/overview/kpis.json
    # Market operations seat: featured cards + board copy, data outside code.
    assetsSeedPath: examples/kb-agent/workspace/data/market/seed.json
    # The connector page (connectors.list/connections/transfers): provider
    # catalog plus the delivery trail from the lakehouse catalog.
    connectorsEnabled: true
    # The graph page (kg.schema/search/subgraph/expand/stats): the ontology
    # registry and the property-graph walks over the graph store; same
    # tenant binding as the kb and tool rows above.
    kgEnabled: true
    kgTenant: !!js "process.env.DSH_KB_TENANT ?? 'demo-food-co'"

# The web workbench serves the business page's embed entry same-origin: the
# /carbon prefix proxies the live carbon ERP with framing guards stripped.
# Patched, not inserted: the web-app bundle already mounts the webserver row.
# A patch's config replaces the row's whole config object (no key merge), so
# host and port ride along with the bundle's own fallback expressions.
- id: webserver
  config:
    host: !!js "ctx.webStartup.host ?? '127.0.0.1'"
    port: !!js "ctx.webStartup.port ?? 3080"
    carbonProxyOrigin: !!js "process.env.CARBON_ERP_URL ?? 'http://127.0.0.1:3000'"

# The mobile client rides the same web process: mobileEnabled serves the
# built dist/mobile.html at /mobile (same origin, same /api gateway, same
# data plane — no new data path). Patched, not inserted: the
# web-app bundle already mounts the web-runtime row; the restated keys keep
# the bundle's own expressions for the fields this patch does not change.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
    mobileEnabled: true

# The web workbench composes new sessions from the enterprise-data-assistant
# role preset instead of the shipped `standard`. Patched, not inserted: the
# web-app bundle already mounts the agent-presets row (the headless profile
# has none, where this patch only warns — its one-shot agent never mounts a
# preset). The example's role presets ride the roster as an explicit root —
# the launcher appends configured roots ahead of the shipped one — so they
# are reachable from any DSH_HOME without a copy step (the writable
# $DSH_HOME/.agent-presets root stays for locally authored presets). The
# scenario presets under scenarios/ are preset-directory-shaped (preset.yml +
# agent.cordis.yml), so the same mechanism puts the thirty food-industry
# scenarios on the roster the portal's scenario cards select. The paths are
# cwd-relative like kb-sqlite's: launch from the repository root.
- id: agent-presets
  config:
    default: enterprise-data-assistant
    roots:
      - path: examples/kb-agent/agent-presets
        trust: user
      - path: examples/kb-agent/scenarios
        trust: user
